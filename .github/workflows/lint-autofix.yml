name: Lint AutoFix

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-autofix:
    name: Lint AutoFix
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
    # This job can push commits to the repository
    # See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
    cache-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          # Only install pnpm: Node.js and dependencies are installed by later steps
          install: false
          node-version-file: false

      - name: Set up Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Installation
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile || pnpm install --frozen-lockfile

      - name: AutoFix Duplicated deps
        run: pnpm lint:deps:fix

      - name: AutoFix Formatting
        run: pnpm format

      - name: AutoFix JS
        run: pnpm lint:js:fix

      - name: AutoFix Style
        run: pnpm lint:style:fix

      - name: AutoFix Spelling
        run: pnpm lint:spelling:fix

      - name: AutoFix Dependency versions
        run: pnpm lint:syncpack:fix

      - name: Print Diff
        run: git diff

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          commit_message: 'refactor: apply lint autofix'
